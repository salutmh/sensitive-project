<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FROM TEXT TO FEELING</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <header class="header">
        <div class="logo">FROM TEXT TO FEELING</div>
    </header>

    <main class="container">
        <section class="hero">
            <h1>FROM TEXT TO FEELING</h1>
            <p>문장을 입력하면 AI가 감성을 분석합니다.</p>
        </section>

        <section class="panel input-panel">
            <textarea id="text-input" placeholder="분석할 문장을 입력하세요... (최대 1000자)" maxlength="1000"></textarea>
            <button id="analyze-btn" class="btn-primary">분석하기</button>
            <div id="error-box" class="error-box hidden"></div>
        </section>

        <section id="result-card" class="panel result-card hidden">
            <div class="result-header">
                <span class="label">감성 결과</span>
                <h2 id="sentiment-result">긍정</h2>
            </div>
            <div class="result-details">
                <div class="detail-item">
                    <span class="label">신뢰도</span>
                    <span id="confidence-result" class="value">92%</span>
                </div>
                <div class="detail-item">
                    <span class="label">이유</span>
                    <p id="reason-result" class="value">만족스럽다는 긍정 표현이 포함되어 있습니다.</p>
                </div>
            </div>
        </section>
    </main>

    <script src="/app.js"></script>
</body>
</html>
